                            //console.log("labelsOriginal", labelsOriginal);

                            // Build an array of colors used in the datasets of the chart
                            let datasetColors = chart.data.datasets.map(function(e) {

                                });
                            datasetColors = datasetColors.flat();

                            // Modify the color and hide state of each label
                            let numLabelPerDataSet = 3;
                            labelsOriginal.forEach(label => {
                                // There are three times as many labels as there are datasets. This converts the label index into the corresponding dataset index
                                //console.log("label=", label);
                                //console.log("label.index=", label.index);
                                label.datasetIndex = (label.index - label.index % numLabelPerDataSet) / numLabelPerDataSet;
                                //console.log("label.datasetIndex", label.datasetIndex);

                                // The hidden state must match the dataset's hidden state
                                label.hidden = !chart.isDatasetVisible(label.datasetIndex);

                                // Change the color to match the dataset
                                label.fillStyle = datasetColors[label.index];
                                });

                            return labelsOriginal;
                            }
                        },
                    onClick: function(mouseEvent, legendItem, legend) {
                        // toggle the visibility of the dataset from what it currently is
                        legend.chart.getDatasetMeta(
                        legendItem.datasetIndex

                        }

function fillCanvasBackgroundWithColor(canvas, color) {
    // Get the 2D drawing context from the provided canvas.
    const context = canvas.getContext('2d');

    // We're going to modify the context state, so it's
    // good practice to save the current state first.
    context.save();

    context.globalCompositeOperation = 'destination-over';

    // Fill in the background. We do this by drawing a rectangle
    // filling the entire canvas, using the provided color.
    context.fillStyle = color;
    context.fillRect(0, 0, canvas.width, canvas.height);

    // Restore the original context state from `context.save()`
    context.restore();
}

const MISSINGDATAVALUE=999;

function createCheckBoxList(cbId, thisInfo, namePrefix, idPrefix) {

    listInfo = checkBoxInfo[thisInfo]

    for (idx=0; idx<listInfo.length; idx++) {

        var idxStr=String(idx+1)

        if (listInfo[idx][0]!=MISSINGDATAVALUE) {

            var br = document.createElement('br');

            var lab = document.createElement('label');
            lab.htmlFor = idPrefix+idxStr;

            var cb = document.createElement('input');
            cb.type="checkbox";
            cb.name=namePrefix+idxStr;
            cb.value=listInfo[idx][0]
            cb.id=idPrefix+idxStr;

            lab.appendChild(cb);
            lab.appendChild(document.createTextNode(listInfo[idx][1] + " ("+ listInfo[idx][2] + ")" ));
            lab.appendChild(br);

            document.getElementById(cbId).appendChild(lab);
        }
    }
}

}
