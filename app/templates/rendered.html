                                label.hidden = !chart.isDatasetVisible(label.datasetIndex);

function fillCanvasBackgroundWithColor(canvas, color) {
    // Get the 2D drawing context from the provided canvas.
    const context = canvas.getContext('2d');

    // We're going to modify the context state, so it's
    // good practice to save the current state first.
    context.save();

    context.globalCompositeOperation = 'destination-over';

    // Fill in the background. We do this by drawing a rectangle
    // filling the entire canvas, using the provided color.
    context.fillStyle = color;
    context.fillRect(0, 0, canvas.width, canvas.height);

    // Restore the original context state from `context.save()`
    context.restore();
}

function createCheckBoxList(cbId, thisInfo, namePrefix, idPrefix) {

    listInfo = checkBoxInfo[thisInfo]

    for (idx=0; idx<listInfo.length; idx++) {

        var idxStr=String(idx+1)

        if (listInfo[idx][0]!=MISSINGDATAVALUE) {

            var br = document.createElement('br');

            var lab = document.createElement('label');
            lab.htmlFor = idPrefix+idxStr;

            var cb = document.createElement('input');
            cb.type="checkbox";
            cb.name=namePrefix+idxStr;
            cb.value=listInfo[idx][0]
            cb.id=idPrefix+idxStr;

            lab.appendChild(cb);
            lab.appendChild(document.createTextNode(listInfo[idx][1] + " ("+ listInfo[idx][2] + ")" ));
            lab.appendChild(br);

            document.getElementById(cbId).appendChild(lab);
        }
    }
}
